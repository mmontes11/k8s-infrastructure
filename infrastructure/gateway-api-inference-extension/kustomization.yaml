# Gateway API Inference Extension (GAIE) CRDs, installed standalone from the
# upstream release so consumers (KServe LLMInferenceService, Envoy Gateway,
# Agent Router) share one owner instead of each chart vendoring its own copy.
# Same pattern as the `gateway-api` Kustomization.
#
# v1.6.2 is the release ADR-0001 (k8s-ai) evaluates the Agent Router
# (v1.2.0) against. It is the version from which InferencePool
# `endpointPickerRef` is optional (v1.6.0), so pools can be used without
# user-managed EPP deployments. Still only the v1 API version is served
# (same shape v1.5.0 had), so nothing consumers watch changes; v1.6 also
# adds the InferencePoolImport CRD (inference.networking.x-k8s.io), which
# stays unused here. The previous pin (v1.5.0, byte-identical to the
# v1.5.0-rc.2 the kserve-llmisvc chart v0.21.0 used to vendor) existed only
# for that chart's compatibility — it now runs with createGIECRDs: false.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: networking
resources:
  - https://github.com/kubernetes-sigs/gateway-api-inference-extension/config/crd?ref=v1.6.2
