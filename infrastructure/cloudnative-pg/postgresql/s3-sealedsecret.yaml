---
# S3 credentials for CNPG barman-cloud backups (same SeaweedFS S3 endpoint
# as the rest of the infra). Keys: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgresql-s3
  namespace: database
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: postgresql-s3
      namespace: database
    type: Opaque
