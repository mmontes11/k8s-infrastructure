apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  storage:
    size: 10Gi
    storageClassName: topolvm

  postgresql:
    parameters:
      shared_buffers: "256MB"

  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      memory: 1Gi

  nodeSelector:
    node.mmontes.io/type: compute-large

  tolerations:
    - effect: NoSchedule
      key: node.mmontes.io/type
      value: compute-large

  certificates:
    serverTLSSecret: postgresql-tls
    serverCASecret: homelab-bundle
    clientSSLSecret: postgresql-client-tls
    clientCASecret: homelab-bundle

  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: postgresql
