apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
spec:
  enableSuperuserAccess: true
  superuserSecret:
    name: postgresql-super

  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: postgresql

  storage:
    size: 10Gi
    storageClass: topolvm

  certificates:
    serverCASecret: homelab-bundle
    serverTLSSecret: postgresql-tls
    clientCASecret: homelab-bundle
    replicationTLSSecret: postgresql-client-tls

  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring

  postgresql:
    parameters:
      shared_buffers: "256MB"

  # Full physical backups + WAL archiving to the SeaweedFS S3 store, same bucket
  # and endpoint as the rest of the infra (see the MariaDB PITR setup in
  # k8s-media). Barman's object-store layout uses fixed subfolders: base backups
  # land in s3://database/postgresql/base/, WALs in s3://database/postgresql/wal/.
  # Retention is 7 days for both, matching the MariaDB 168h retention.
  backup:
    barmanObjectStore:
      destinationPath: s3://database/postgresql
      endpointURL: http://seaweedfs-s3.storage.svc.cluster.local:8333
      data:
        compression: gzip
      wal:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: postgresql-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: postgresql-s3
          key: AWS_SECRET_ACCESS_KEY
    retentionPolicy: 7d
    target: primary

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

  affinity:
    tolerations:
    - effect: NoSchedule
      key: node.mmontes.io/type
      value: compute-large
    nodeSelector:
      node.mmontes.io/type: compute-large
