apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
spec:
  enableSuperuserAccess: true
  superuserSecret:
    name: postgresql-super

  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: postgresql

  storage:
    size: 10Gi
    storageClass: topolvm

  certificates:
    serverCASecret: homelab-bundle
    serverTLSSecret: postgresql-tls
    clientCASecret: homelab-bundle
    replicationTLSSecret: postgresql-client-tls

  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring

  postgresql:
    parameters:
      shared_buffers: "256MB"

  # Full physical backups + WAL archiving to the SeaweedFS S3 store via the
  # Barman Cloud CNPG-I plugin; CNPG deprecates the in-tree barmanObjectStore
  # support in favour of it. The plugin server runs in this namespace (see
  # ../plugin-barman-cloud-helmrelease.yaml) and the store configuration lives
  # in objectstore.yaml. serverName keeps the previous barman layout so the
  # existing backups and WALs in s3://database/postgresql stay reachable.
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: postgresql-barman
      serverName: postgresql

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

  affinity:
    tolerations:
    - effect: NoSchedule
      key: node.mmontes.io/type
      value: compute-large
    nodeSelector:
      node.mmontes.io/type: compute-large

  # ---------------------------------------------------------------------------
  # RESTORE — uncomment the matching block only when a restore is needed
  #
  # CNPG restores by recreating the cluster from a backup. This repo is
  # Flux-managed, so suspend the Kustomization first or Flux will re-apply
  # the live spec in the meantime:
  #   1. kubectl -n flux-system patch kustomization postgresql \
  #        --patch '{"spec":{"suspend":true}}' --type merge
  #   2. kubectl -n database delete cluster postgresql
  #      (the topolvm PVCs are kept; recovery restores onto the existing volumes)
  #   3. comment out `bootstrap.initdb` above, uncomment ONE of the two
  #      bootstrap.recovery variants below plus the shared externalClusters
  #      block, then apply: kubectl -n database apply -f cluster.yaml
  #   4. once the cluster is healthy, restore `bootstrap.initdb`, re-comment
  #      the recovery blocks, and resume Flux:
  #      kubectl -n flux-system patch kustomization postgresql \
  #        --patch '{"spec":{"suspend":false}}' --type merge
  #
  # Both variants read the Barman store s3://database/postgresql (server name
  # `postgresql`, matching the plugins block above).
  # ---------------------------------------------------------------------------
#
#   # Restore from the latest base backup only, without replaying archived WALs
#   bootstrap:
#     recovery:
#       source: postgresql
#       database: app
#       owner: app
#       secret:
#         name: postgresql
#       recoveryTarget:
#         targetImmediate: true
#
#   # Restore from a base backup + archived WALs up to a point in time (PITR)
#   bootstrap:
#     recovery:
#       source: postgresql
#       database: app
#       owner: app
#       secret:
#         name: postgresql
#       recoveryTarget:
#         # RFC3339 or PostgreSQL timestamp; no timezone = UTC
#         targetTime: "2026-08-22T06:00:00Z"
#
#   # Shared by both variants: Barman store to pull the backup and WALs from
#   externalClusters:
#   - name: postgresql
#     plugin:
#       name: barman-cloud.cloudnative-pg.io
#       parameters:
#         barmanObjectName: postgresql-barman
#         serverName: postgresql
