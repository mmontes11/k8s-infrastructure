apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
spec:
  enableSuperuserAccess: true
  superuserSecret:
    name: postgresql-super

  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: postgresql

  storage:
    size: 10Gi
    storageClass: topolvm

  certificates:
    serverCASecret: homelab-bundle
    serverTLSSecret: postgresql-tls
    clientCASecret: homelab-bundle
    replicationTLSSecret: postgresql-client-tls

  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring

  postgresql:
    parameters:
      shared_buffers: "256MB"

  # Full physical backups + WAL archiving to the SeaweedFS S3 store via the
  # Barman Cloud CNPG-I plugin; CNPG deprecates the in-tree barmanObjectStore
  # support in favour of it. The plugin server runs in this namespace (see
  # ../plugin-barman-cloud-helmrelease.yaml) and the store configuration lives
  # in objectstore.yaml. serverName keeps the previous barman layout so the
  # existing backups and WALs in s3://database/postgresql stay reachable.
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: postgresql-barman
      serverName: postgresql

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

  affinity:
    tolerations:
    - effect: NoSchedule
      key: node.mmontes.io/type
      value: compute-large
    nodeSelector:
      node.mmontes.io/type: compute-large
