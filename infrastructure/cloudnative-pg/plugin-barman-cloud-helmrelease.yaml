apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  chartRef:
    kind: OCIRepository
    name: plugin-barman-cloud
  dependsOn:
  - name: cloudnative-pg
  interval: 1h0m0s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Pin the plugin server and pod sidecar to an explicit release instead of
    # relying on the chart appVersion, so renovate can track them independently
    image:
      tag: "v0.14.0"
    sidecarImage:
      tag: "v0.14.0"
