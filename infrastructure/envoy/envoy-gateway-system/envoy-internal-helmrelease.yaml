apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-internal
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-internal
  interval: 10m
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    crds:
      enabled: false
    config:
      # See: https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/envoy-internal
        logging:
          level:
            default: info
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Controller deploys to the release namespace (envoy-gateway-system).
              # Kept in GatewayNamespace mode: in Namespace mode the chart would only
              # grant a namespaced infra-manager Role, so the controller could no
              # longer create the proxy Deployment in envoy-internal (LAB-385).
              type: GatewayNamespace
        # See: https://gateway.envoyproxy.io/docs/api/extension_types/#envoyproxyspec
        envoyProxy:
          provider:
            type: Kubernetes
            kubernetes:
              envoyDeployment:
                replicas: 2            
                container:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                pod:
                  affinity:
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                            matchLabels:
                              app.kubernetes.io/name: envoy
                              app.kubernetes.io/component: proxy
                              gateway.networking.k8s.io/gateway-name: envoy-internal
                          topologyKey: kubernetes.io/hostname
                  priorityClassName: system-node-critical
              envoyService:
                type: LoadBalancer
                # Envoy Gateway defaults to Local; Cluster makes the VIP reachable
                # from pods on nodes without a local endpoint (LAB-382).
                externalTrafficPolicy: Cluster
                annotations:
                  metallb.io/loadBalancerIPs: 10.0.0.71
        extensionApis:
          enableEnvoyPatchPolicy: true
          enableBackend: true
        extensionManager:
          hooks:
            xdsTranslator:
              translation:
                listener:
                  includeAll: true
                route:
                  includeAll: true
                cluster:
                  includeAll: true
                secret:
                  includeAll: true
              post:
                - Translation
                - Cluster
                - Route
          service:
            fqdn:
              # Agent Router controller service installed in `envoy-gateway-system`, as part of `k8s-ai`.
              hostname: ai-gateway-controller.envoy-gateway-system.svc.cluster.local
              port: 1063
          backendResources:
            - group: inference.networking.k8s.io
              kind: InferencePool
              version: v1
