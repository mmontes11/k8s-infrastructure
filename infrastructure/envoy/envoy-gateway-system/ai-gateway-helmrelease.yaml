apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: ai-gateway
  interval: 10m
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    # Configuration for the Envoy Gateway component that AI Gateway relies on to program Envoy.
    envoyGateway:
      # The namespace where the Envoy Gateway controller is installed.
      namespace: envoy-gateway-system
    controller:
      watch:
        # TODO: avoid reconciling traefik Gateway. Remove after migrating to Envoy.
        # INFO    controller.gateway    No pods, deployments or daemonsets found for the Gateway.    {"namespace": "networking", "name": "traefik-internal", "requeueAfter": "5s"}
        namespaces:
          - ai
          - envoy-internal
