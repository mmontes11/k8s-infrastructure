apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 10m
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    crds:
      enabled: false
    config:
      # Shared control plane for all tenants (design/adr-001)
      # See: https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Required for the shared design (design/adr-001): proxies deploy
              # to each Gateway's own namespace (per-tenant data plane). Unset,
              # the controller falls back to ControllerNamespace mode and the
              # chart renders only a namespaced infra-manager Role, so it could
              # not create proxy resources in tenant namespaces.
              type: GatewayNamespace
        logging:
          level:
            default: info
        # Fleet-wide proxy defaults. Per-tenant specifics (LoadBalancer IP,
        # replicas, PDB, anti-affinity) live in each tenant's EnvoyProxy,
        # referenced from its Gateway via spec.infrastructure.parametersRef.
        # See: https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway
        envoyProxy:
          provider:
            type: Kubernetes
            kubernetes:
              envoyDeployment:
                replicas: 1
                container:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
        extensionApis:
          enableEnvoyPatchPolicy: true
          enableBackend: true
        extensionManager:
          hooks:
            xdsTranslator:
              translation:
                listener:
                  includeAll: true
                route:
                  includeAll: true
                cluster:
                  includeAll: true
                secret:
                  includeAll: true
              post:
                - Translation
                - Cluster
                - Route
          service:
            fqdn:
              # Agent Router controller service, installed in
              # envoy-gateway-system by this same kustomization.
              hostname: ai-gateway-controller.envoy-gateway-system.svc.cluster.local
              port: 1063
          backendResources:
            - group: inference.networking.k8s.io
              kind: InferencePool
              version: v1
