# GatewayClass and data-plane Gateway for the AI stack (LAB-362).
#
# Lives in the dedicated `envoy-internal` namespace. With the
# GatewayNamespace deploy mode (see envoy-internal-helmrelease.yaml) the
# Envoy proxy for this Gateway is deployed into this namespace (ServiceAccount
# named after the Gateway, Deployment + LoadBalancer Service as
# `envoy-envoy-internal-<hash>`).
#
# Named after the traefik-internal pattern: the internal of the planned
# envoy-internal / envoy-external pair. The GatewayClass and the controller
# name are tenant specific (gateway.envoyproxy.io/envoy-internal) so the
# pair can coexist in one cluster. The controller watches all namespaces —
# multiple tenants attach routes to this Gateway, so a per-namespace watch
# restriction is not worth it (review round 5).
#
# Naming constraint: the gateway-helm chart hardcodes the controller's own
# resources (Deployment/Service/ServiceAccount) to the name `envoy-gateway`
# in the Gateway's namespace, and the GatewayNamespace data plane takes the
# ServiceAccount's name from the Gateway. A Gateway named `envoy-gateway`
# would collide with the controller and never get a proxy — this name
# (`envoy-internal`) avoids that.
#
# External access (same pattern as traefik):
#   - Data-plane customization — LoadBalancer pinned to 10.0.0.71 (MetalLB
#     `load-balancer` pool), deployment resources and priority class — is
#     set through the chart values under
#     config.envoyGateway.envoyProxy (envoy-internal-helmrelease.yaml),
#     which the controller loads from the `envoy-gateway-config`
#     ConfigMap. It serves as the default EnvoyProxy configuration for
#     every proxy this controller manages (here: exactly this Gateway).
#   - HTTPS for mmontes-llm.duckdns.org (exact match). The Certificate and
#     secret are created automatically by cert-manager from the
#     cert-manager.io/cluster-issuer annotation, one per listener.
#   - Local DNS resolution of the hostname: a Pi-hole record (homelab repo)
#     for LAN clients and a CoreDNS `hosts` entry in infrastructure/dns for
#     in-cluster clients.
#   - The HTTP listener is redirect-only (LAB-374): it accepts routes from
#     the Gateway's own namespace only (allowedRoutes.from: Same) and serves
#     the single catch-all HTTP -> HTTPS redirect
#     (envoy-internal-http-redirect.yaml). Tenant routes attach to the
#     websecure listener only, whose hostname they must match.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-internal
  labels:
    gatewayclass.mmontes.io/type: envoy-internal
spec:
  controllerName: gateway.envoyproxy.io/envoy-internal
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: envoy-internal
  listeners:
    # Redirect-only: the catch-all envoy-internal-http-redirect HTTPRoute
    # (same namespace) is the only route accepted on :80 (LAB-374).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: mmontes-llm.duckdns.org
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          # Envoy Gateway requires the core group to be omitted on Secret refs.
          - name: envoy-internal-tls
            kind: Secret
