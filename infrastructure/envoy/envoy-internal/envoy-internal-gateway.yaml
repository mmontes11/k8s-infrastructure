apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  # Shared GatewayClass of the single Envoy Gateway controller in
  # envoy-gateway-system (design/adr-001).
  gatewayClassName: envoy
  # Tenant-specific proxy configuration, merged over the fleet-wide defaults
  # of the shared controller (design/adr-001).
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-internal
  listeners:
    # Redirect-only: the catch-all envoy-internal-http-redirect HTTPRoute
    # is the only route accepted on :80.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.mmontes-internal.duckdns.org"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: envoy-internal-tls
            kind: Secret
    # Buildkit TCP passthrough: mirrors traefik-internal so envoy-internal is a
    # drop-in (LAB-386). Routes attach from the `container` namespace only.
    - name: builder-amd64
      protocol: TCP
      port: 3000
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: container
    - name: builder-arm64
      protocol: TCP
      port: 3001
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: container
