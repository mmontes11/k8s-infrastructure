apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-proxy
spec:
  namespaceSelector:
    matchNames:
      - envoy-internal
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      gateway.networking.k8s.io/gateway-name: envoy-internal
  endpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 25s
      honorLabels: false
