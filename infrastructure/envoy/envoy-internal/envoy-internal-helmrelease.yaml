apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-internal
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-internal
  interval: 10m
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    crds:
      enabled: false
    config:
      # See: https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/envoy-internal
        logging:
          level:
            default: info
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
            watch:
              type: Namespaces
              namespaces:
                - envoy-internal
        # See: https://gateway.envoyproxy.io/docs/api/extension_types/#envoyproxyspec
        envoyProxy:
          provider:
            type: Kubernetes
            kubernetes:
              envoyDeployment:
                replicas: 2            
                container:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                pod:
                  affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: envoy
                            app.kubernetes.io/component: proxy
                            gateway.networking.k8s.io/gateway-name: envoy-internal
                        topologyKey: kubernetes.io/hostname
                  priorityClassName: system-node-critical
              envoyService:
                type: LoadBalancer
                annotations:
                  metallb.io/loadBalancerIPs: 10.0.0.71
        extensionApis:
          enableEnvoyPatchPolicy: true
          enableBackend: true
        extensionManager:
          hooks:
            xdsTranslator:
              translation:
                listener:
                  includeAll: true
                route:
                  includeAll: true
                cluster:
                  includeAll: true
                secret:
                  includeAll: true
              post:
                - Translation
                - Cluster
                - Route
          service:
            fqdn:
              # Agent Router controller service installed in `ai` namespace, as part of `k8s-ai`.
              hostname: ai-gateway-controller.ai.svc.cluster.local
              port: 1063
          backendResources:
            - group: inference.networking.k8s.io
              kind: InferencePool
              version: v1
