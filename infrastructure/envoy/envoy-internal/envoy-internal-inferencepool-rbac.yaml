apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-internal-inferencepool-role
rules:
  - apiGroups:
      - "inference.networking.k8s.io"
    resources:
      - "inferencepools"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envoy-internal-inferencepool-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envoy-internal-inferencepool-role
subjects:
  - kind: ServiceAccount
    # Created by the gateway-helm chart into the release namespace (`envoy-gateway-system`).
    name: envoy-gateway
    namespace: envoy-gateway-system
