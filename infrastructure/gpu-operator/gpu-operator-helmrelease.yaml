apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  chartRef:
    kind: OCIRepository
    name: gpu-operator
  interval: 1h0m0s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Driver and container-toolkit are provided by Talos OS system extensions
    # (nvidia-open-gpu-kernel-modules-lts + nvidia-container-toolkit-lts schematics),
    # so the gpu-operator must not deploy its own.
    # Reference: https://docs.siderolabs.com/talos/v1.13/configure-your-talos-cluster/hardware-and-drivers/nvidia-gpu
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    # Let the operand DaemonSets (device-plugin, dcgm-exporter, operator-validator, ...)
    # schedule on the GPU node, which carries the NoSchedule taint
    # node.mmontes.io/type=compute-xlarge. The chart default only tolerates nvidia.com/gpu.
    daemonsets:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: node.mmontes.io/type
          value: compute-xlarge
          effect: NoSchedule
    # The NFD worker is what labels the GPU node with
    # feature.node.kubernetes.io/pci-10de.present, which the operator uses to place every
    # operand. We pin it to the GPU node via nodeAffinity (nvidia.com/gpu.present — the same
    # label the old device-plugin/dcgm-exporter DaemonSets used) and drop the control-plane
    # toleration: NFD does not need to run on the control plane.
    node-feature-discovery:
      worker:
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: node.mmontes.io/type
            value: compute-xlarge
            effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nvidia.com/gpu.present
                      operator: Exists
    # Preserve the previous time-slicing configuration: 20 shareable nvidia.com/gpu, no rename.
    devicePlugin:
      config:
        create: true
        name: device-plugin-config
        default: default
        data:
          default: |-
            version: v1
            sharing:
              timeSlicing:
                renameByDefault: false
                resources:
                - name: nvidia.com/gpu
                  replicas: 20
    # Preserve the previous DCGM exporter monitoring + resources.
    # The gpu-operator 26.x DaemonSet template hardcodes DCGM_EXPORTER_KUBERNETES=true
    # (per-Pod mode: one metric series per GPU/Pod pair). Override it via the spec env
    # list to keep one metric set per GPU, like the old standalone release did
    # (replaces the old postRenderer patch; NVIDIA/gpu-operator#2674).
    # Note: enablePodLabels/enablePodUID only control the pod-label/UID enrichment
    # on top of that, not the per-Pod mode itself.
    dcgmExporter:
      env:
        - name: DCGM_EXPORTER_KUBERNETES
          value: "false"
      # TODO: Verify images before bumping. See: https://hub.docker.com/r/nvidia/dcgm-exporter/tags.
      # Latest images aren't properly built, they have the wrong architecture:
      # "dcgm-exporter-entrypoint.sh: exec format error"
      # Tags tested that reuturn an error in linux/amd64: 4.6.1-4.8.4-distroless, 4.8.4.
      repository: nvcr.io/nvidia/k8s
      image: dcgm-exporter
      version: 4.8.3
      imagePullPolicy: IfNotPresent
      serviceMonitor:
        enabled: true
        relabelings:
          - sourceLabels:
              - job
            targetLabel: instance
            action: Replace
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 1Gi
          nvidia.com/gpu: 1
  # The dcgm-exporter distroless image sets USER root:root (a name, not a UID). Since the
  # GPU node moved to Talos v1.14 (containerd 2.3), resolving that name fails with
  # "failed to create containerd container: no users found". Running the operands with a
  # numeric UID/GID skips the name lookup. All operands already run as root.
  # The chart does not expose daemonsets.podSecurityContext, so patch the ClusterPolicy.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterPolicy
              name: cluster-policy
            patch: |-
              - op: add
                path: /spec/daemonsets/podSecurityContext
                value:
                  runAsUser: 0
                  runAsGroup: 0
