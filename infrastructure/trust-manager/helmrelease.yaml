apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
spec:
  chartRef:
    kind: OCIRepository
    name: trust-manager
  interval: 1h0m0s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds: 
      enabled: true
      keep: true
    secretTargets:
      enabled: true
      authorizedSecretsAll: true
    app:
      trust:
        namespace: pki
