apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dcgm-exporter
spec:
  chart:
    spec:
      chart: dcgm-exporter
      sourceRef:
        kind: HelmRepository
        name: nvidia-dcgm-exporter
      version: "4.8.3"
  interval: 1h0m0s
  values:
    # Pin the image the GPU operator currently deploys on this node (same
    # exporter version as the chart's appVersion; the chart's own default is
    # the -distroless DCGM-4.6.0 variant).
    image:
      tag: "4.8.3"
    # DRA mode: the exporter runs in Kubernetes mode and attributes metrics
    # to Pods from the gpu.nvidia.com ResourceSlices (KUBERNETES_ENABLE_DRA,
    # chart RBAC). This replaces both the old DCGM_EXPORTER_KUBERNETES=false
    # override (per-GPU metric set) and the nvidia.com/gpu limit, which no
    # device plugin registers in DRA mode.
    kubernetesDRA:
      enabled: true
    # Pin to the GPU node via the cluster's own node label (the same label
    # the node's NoSchedule taint uses) instead of nvidia.com/gpu.present,
    # which the now-retired device plugin used to set.
    nodeSelector:
      node.mmontes.io/type: compute-xlarge
    tolerations:
      - key: node.mmontes.io/type
        value: compute-xlarge
        effect: NoSchedule
    serviceMonitor:
      enabled: true
      relabelings:
        - sourceLabels:
            - job
          targetLabel: instance
          action: Replace
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
  # The adminAccess claim gives the exporter pod GPU device access (CDI
  # injection) for its DCGM hostengine without consuming any of the 20
  # consumable shares reserved for workloads. No runtimeClassName: CDI
  # device injection is driven by the claim, as in the Talos DRA guide's
  # test workload.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: nvidia-dcgm-exporter
            patch: |-
              - op: add
                path: /spec/template/spec/resourceClaimTemplates
                value:
                  - name: dcgm-gpu
                    spec:
                      adminAccess: true
                      devices:
                        requests:
                          - name: gpu
                            exactly:
                              deviceClassName: gpu.nvidia.com
              - op: add
                path: /spec/template/spec/containers/0/resources/claims
                value:
                  - name: dcgm-gpu
