apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: job
spec:
  groups:
  - name: kubernetes-jobs.rules
    rules:
    - alert: KubeJobStatusFailed
      expr: kube_job_status_failed > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
        description: |
          kube_job_status_failed is > 0 for Job {{ $labels.job_name }} in namespace {{ $labels.namespace }}.