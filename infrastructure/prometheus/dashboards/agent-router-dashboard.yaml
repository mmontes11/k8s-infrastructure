               "thresholds": {
                 "mode": "absolute",
                 "steps": [
                   {
                     "color": "green",
                     "value": 0
                   },
                   {
                     "color": "red",
                     "value": 80
                   }
                 ]
               },
               "unit": "s"
             },
             "overrides": []
           },
           "gridPos": {
             "h": 8,
             "w": 12,
             "x": 0,
             "y": 13
           },
           "id": 14,
           "options": {
             "annotations": {
