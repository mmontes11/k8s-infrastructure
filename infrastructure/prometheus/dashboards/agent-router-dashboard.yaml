# see: 
# https://github.com/theagentrouter/agent-router/blob/main/examples/monitoring/grafana-dashboard.json
# https://handbook.modular.com/llm-inference-basics/llm-inference-metrics/
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-router-dashboard
  labels:
    grafana_dashboard: "1"
data:
  agent-router-dashboard.json: |
     {
       "panels": [
         {
           "datasource": {
             "type": "prometheus",
             "uid": "${DS_PROMETHEUS}"
           },
           "description": "Total GenAI requests handled by the gateway, cumulative over the selected time range.",
           "fieldConfig": {
             "defaults": {
               "color": {
                 "mode": "thresholds"
               },
               "noValue": "0",
               "thresholds": {
                 "mode": "absolute",
                 "steps": [
                   {
                     "color": "green",
                     "value": 0
                   },
                   {
                     "color": "red",
                     "value": 80
                   }
                 ]
               }
             },
             "overrides": []
           },
           "gridPos": {
             "h": 5,
             "w": 6,
             "x": 0,
             "y": 0
           },
           "id": 1,
           "options": {
             "colorMode": "value",
             "graphMode": "area",
             "justifyMode": "auto",
             "orientation": "auto",
             "percentChangeColorMode": "standard",
             "reduceOptions": {
               "calcs": [
                 "lastNotNull"
               ],
               "fields": "",
               "values": false
             },
             "showPercentChange": false,
             "textMode": "auto",
             "wideLayout": true
           },
           "targets": [
             {
               "datasource": {
                 "type": "prometheus",
                 "uid": "${DS_PROMETHEUS}"
               },
               "expr": "sum(gen_ai_server_request_duration_seconds_count)",
               "legendFormat": "requests",
               "refId": "A"
             }
           ],
           "title": "Total Requests",
           "type": "stat"
         },
         {
           "datasource": {
             "type": "prometheus",
             "uid": "${DS_PROMETHEUS}"
           },
           "description": "Total input and output tokens processed, cumulative over the selected time range. Cached and reasoning tokens are not counted here.",
           "fieldConfig": {
             "defaults": {
               "color": {
                 "mode": "thresholds"
               },
               "noValue": "0",
               "thresholds": {
                 "mode": "absolute",
                 "steps": [
                   {
                     "color": "green",
                     "value": 0
                   },
                   {
                     "color": "red",
                     "value": 80
                   }
                 ]
               },
               "unit": "short"
             },
             "overrides": []
           },
           "gridPos": {
             "h": 5,
             "w": 6,
             "x": 6,
             "y": 0
           },
           "id": 2,
           "options": {
             "colorMode": "value",
             "graphMode": "area",
             "justifyMode": "auto",
             "orientation": "auto",
             "percentChangeColorMode": "standard",
             "reduceOptions": {
               "calcs": [
                 "lastNotNull"
               ],
               "fields": "",
               "values": false
             },
             "showPercentChange": false,
             "textMode": "auto",
             "wideLayout": true
           },
           "targets": [
             {
               "datasource": {
                 "type": "prometheus",
                 "uid": "${DS_PROMETHEUS}"
               },
               "expr": "sum(gen_ai_client_token_usage_sum{gen_ai_token_type=~\"input|output\"})",
               "legendFormat": "tokens",
               "refId": "A"
             }
           ],
           "title": "Total Tokens (input + output)",
           "type": "stat"
         },
         {
           "datasource": {
             "type": "prometheus",
             "uid": "${DS_PROMETHEUS}"
           },
           "description": "Time to First Token (TTFT) is the time from sending the request to generating the first token — it reflects how quickly the model starts responding. Shown as the 95th percentile over the last 15 minutes.",
           "fieldConfig": {
             "defaults": {
               "color": {
                 "mode": "thresholds"
               },
               "noValue": "0",
               "thresholds": {
                 "mode": "absolute",
                 "steps": [
                   {
                     "color": "green",
                     "value": 0
                   },
                   {
                     "color": "red",
                     "value": 80
                   }
                 ]
               },
               "unit": "s"
             },
             "overrides": []
           },
           "gridPos": {
             "h": 5,
             "w": 6,
             "x": 12,
             "y": 0
           },
           "id": 3,
           "options": {
             "colorMode": "value",
             "graphMode": "area",
             "justifyMode": "auto",
             "orientation": "auto",
             "percentChangeColorMode": "standard",
             "reduceOptions": {
               "calcs": [
                 "lastNotNull"
               ],
               "fields": "",
               "values": false
             },
             "showPercentChange": false,
             "textMode": "auto",
             "wideLayout": true
           },
           "targets": [
             {
               "datasource": {
                 "type": "prometheus",
                 "uid": "${DS_PROMETHEUS}"
               },
               "expr": "histogram_quantile(0.95, sum(rate(gen_ai_server_time_to_first_token_seconds_bucket[15m])) by (le))",
               "legendFormat": "p95 TTFT",
               "refId": "A"
             }
           ],
           "title": "P95 Time to First Token (TTFT)",
           "type": "stat"
         },
         {
           "datasource": {
             "type": "prometheus",
             "uid": "${DS_PROMETHEUS}"
           },
           "description": "End-to-end latency (E2EL) is the time from sending the request to receiving the final token — it directly affects perceived responsiveness. Shown as the 95th percentile over the last 15 minutes.",
           "fieldConfig": {
             "defaults": {
               "color": {
                 "mode": "thresholds"
               },
               "noValue": "0",
               "thresholds": {
                 "mode": "absolute",
                 "steps": [
                   {
                     "color": "green",
                     "value": 0
                   },
                   {
                     "color": "red",
                     "value": 80
                   }
                 ]
               },
               "unit": "s"
             },
             "overrides": []
           },
           "gridPos": {
             "h": 5,
             "w": 6,
             "x": 18,
             "y": 0
           },
           "id": 4,
           "options": {
             "colorMode": "value",
             "graphMode": "area",
             "justifyMode": "auto",
             "orientation": "auto",
             "percentChangeColorMode": "standard",
             "reduceOptions": {
               "calcs": [
                 "lastNotNull"
               ],
               "fields": "",
               "values": false
             },
             "showPercentChange": false,
             "textMode": "auto",
             "wideLayout": true
           },
           "targets": [
             {
               "datasource": {
                 "type": "prometheus",
                 "uid": "${DS_PROMETHEUS}"
               },
               "expr": "histogram_quantile(0.95, sum(rate(gen_ai_server_request_duration_seconds_bucket[15m])) by (le))",
               "legendFormat": "p95 duration",
               "refId": "A"
             }
           ],
           "title": "P95 Request Duration (E2EL)",
           "type": "stat"
         },
         {
           "datasource": {
             "type": "prometheus",
             "uid": "${DS_PROMETHEUS}"
           },
           "description": "Cumulative token usage broken down by type (input, output, cached, reasoning). Useful for spotting prompt-caching effectiveness and reasoning-token overhead.",
           "fieldConfig": {
             "defaults": {
               "color": {
                 "mode": "palette-classic"
               },
               "noValue": "0",
               "custom": {
                 "axisBorderShow": false,
                 "axisCenteredZero": false,
                 "axisColorMode": "text",
                 "axisLabel": "",
                 "axisPlacement": "auto",
                 "fillOpacity": 80,
                 "gradientMode": "none",
                 "hideFrom": {
                   "legend": false,
                   "tooltip": false,
                   "viz": false
                 },
                 "lineWidth": 1,
                 "scaleDistribution": {
                   "type": "linear"
                 },
                 "thresholdsStyle": {
                   "mode": "off"
                 }
               },
               "thresholds": {
                 "mode": "absolute",
                 "steps": [
                   {
                     "color": "green",
                     "value": 0
                   },
                   {
                     "color": "red",
                     "value": 80
                   }
                 ]
               },
               "unit": "short"
             },
             "overrides": []
           },
           "gridPos": {
             "h": 8,
             "w": 12,
             "x": 0,
             "y": 5
           },
           "id": 5,
           "options": {
             "barRadius": 0,
             "barWidth": 0.97,
             "fullHighlight": false,
             "groupWidth": 0.7,
             "legend": {
               "calcs": [],
               "displayMode": "list",
               "placement": "bottom",
               "showLegend": true
             },
             "orientation": "horizontal",
             "showValue": "auto",
             "stacking": "none",
             "tooltip": {
               "hideZeros": false,
               "mode": "single",
               "sort": "none"
             },
             "xTickLabelRotation": 0,
             "xTickLabelSpacing": 0
           },
           "targets": [
             {
               "datasource": {
                 "type": "prometheus",
                 "uid": "${DS_PROMETHEUS}"
               },
               "expr": "sum by (gen_ai_token_type) (gen_ai_client_token_usage_sum)",
               "instant": true,
               "legendFormat": "{{gen_ai_token_type}}",
               "refId": "A"
             }
           ],
           "title": "Token Usage by Type (input / output / cached / reasoning)",
           "type": "barchart"
         },
         {
           "datasource": {
             "type": "prometheus",
             "uid": "${DS_PROMETHEUS}"
           },
           "description": "End-to-end latency (E2EL) percentiles — the time from sending the request to receiving the final token. The median reflects the typical experience, P95 the near-worst, and P99 the tail latency that can make or break user experience.",
