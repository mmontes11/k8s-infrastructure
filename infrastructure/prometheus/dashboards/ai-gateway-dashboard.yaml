# Custom (non-upstream) dashboard for the Agent Router (envoyproxy/ai-gateway)
# controller metrics (LAB-365). The upstream repo ships no Grafana
# dashboards (checked the repo and the ai-gateway-helm chart templates
# at chart v1.2.0), so this minimal dashboard covers the four OpenTelemetry
# GenAI semconv metrics the controller records on its `http-metrics`
# (8080) port at /metrics — the series that back the Modular-handbook
# TTFT/TPOT/duration/token metrics at the gateway layer:
#   gen_ai_server_time_to_first_token_seconds,
#   gen_ai_server_time_per_output_token_seconds,
#   gen_ai_server_request_duration_seconds,
#   gen_ai_client_token_usage
# (Prometheus names and label sets verified against the project's own
# test expectations: envoyproxy/ai-gateway cmd/extproc/mainlib/admin_test.go).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-dashboard
  labels:
    grafana_dashboard: "1"
data:
  ai-gateway-dashboard.json: |
    {
      "title": "AI Gateway (Agent Router)",
      "uid": "ai-gateway-agent-router",
      "tags": [
        "ai-gateway",
        "agent-router",
        "gen-ai"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": true,
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "model",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "query": "label_values(gen_ai_server_request_duration_seconds, gen_ai_original_model)",
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "options": [],
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Time to first token (seconds)",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.5, sum by (le, gen_ai_original_model) (rate(gen_ai_server_time_to_first_token_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p50 {{gen_ai_original_model}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.9, sum by (le, gen_ai_original_model) (rate(gen_ai_server_time_to_first_token_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p90 {{gen_ai_original_model}}",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le, gen_ai_original_model) (rate(gen_ai_server_time_to_first_token_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p99 {{gen_ai_original_model}}",
              "range": true,
              "refId": "C"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Time per output token (seconds)",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.5, sum by (le, gen_ai_original_model) (rate(gen_ai_server_time_per_output_token_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p50 {{gen_ai_original_model}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le, gen_ai_original_model) (rate(gen_ai_server_time_per_output_token_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p95 {{gen_ai_original_model}}",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le, gen_ai_original_model) (rate(gen_ai_server_time_per_output_token_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p99 {{gen_ai_original_model}}",
              "range": true,
              "refId": "C"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Request duration (seconds)",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.5, sum by (le, gen_ai_original_model) (rate(gen_ai_server_request_duration_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p50 {{gen_ai_original_model}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.9, sum by (le, gen_ai_original_model) (rate(gen_ai_server_request_duration_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p90 {{gen_ai_original_model}}",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le, gen_ai_original_model) (rate(gen_ai_server_request_duration_seconds_bucket{gen_ai_original_model=~\"$model\"}[5m])))",
              "legendFormat": "p99 {{gen_ai_original_model}}",
              "range": true,
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Request rate by model (req/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum by (gen_ai_original_model) (rate(gen_ai_server_request_duration_seconds_count{gen_ai_original_model=~\"$model\"}[5m]))",
              "legendFormat": "{{gen_ai_original_model}}",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Token usage rate by model and type (tokens/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum by (gen_ai_original_model, gen_ai_token_type) (rate(gen_ai_client_token_usage_sum{gen_ai_original_model=~\"$model\"}[5m]))",
              "legendFormat": "{{gen_ai_original_model}} / {{gen_ai_token_type}}",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Error rate (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "100 * sum(rate(gen_ai_server_request_duration_seconds_count{error_type!=\"\"}[5m])) / sum(rate(gen_ai_server_request_duration_seconds_count[5m]))",
              "legendFormat": "errors",
              "range": true,
              "refId": "A"
            }
          ]
        }
      ]
    }
