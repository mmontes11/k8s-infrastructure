# GatewayClass and data-plane Gateway for the AI stack (LAB-362).
#
# With the GatewayNamespace deploy mode (see envoy-gateway-helmrelease.yaml)
# the Envoy proxy for this Gateway is deployed into this namespace with
# resources named after the Gateway (Deployment + LoadBalancer Service +
# ServiceAccount). The Gateway is named `ai-gateway` (LAB-374), NOT
# `envoy-gateway`: in GatewayNamespace mode the controller refuses to create
# proxy resources that collide with its own well-known resource names
# (the Helm release creates the controller Deployment/Service/ServiceAccount
# `envoy-gateway` in this namespace), so a Gateway named `envoy-gateway`
# here would never get a proxy.
#
# External access (same pattern as traefik):
#   - LoadBalancer pinned to 10.0.0.71 (MetalLB `load-balancer` pool) via
#     spec.infrastructure.annotations, which Envoy Gateway copies onto the
#     proxy's workload and Service.
#   - HTTPS for mmontes-llm.duckdns.org (exact match). The Certificate and
#     secret are created automatically by cert-manager from the
#     cert-manager.io/cluster-issuer annotation, one per listener.
#   - Local DNS resolution of the hostname: a Pi-hole record (homelab repo)
#     for LAN clients and a CoreDNS `hosts` entry in infrastructure/dns for
#     in-cluster clients.
#   - The HTTP listener is redirect-only (LAB-374): it accepts routes from
#     the Gateway's own namespace only (allowedRoutes.from: Same) and serves
#     the single catch-all HTTP -> HTTPS redirect
#     (envoy-gateway-http-redirect.yaml). Tenant routes attach to the
#     websecure listener only, whose hostname they must match.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: 10.0.0.71
  listeners:
    # Redirect-only: the catch-all envoy-gateway-http-redirect HTTPRoute
    # (same namespace) is the only route accepted on :80 (LAB-374).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: mmontes-llm.duckdns.org
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          # Envoy Gateway requires the core group to be omitted on Secret refs.
          - name: envoy-gateway-tls
            kind: Secret
