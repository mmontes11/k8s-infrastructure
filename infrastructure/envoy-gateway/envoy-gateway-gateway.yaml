# GatewayClass and data-plane Gateway for the AI stack (LAB-362).
#
# With the GatewayNamespace deploy mode (see envoy-gateway-helmrelease.yaml)
# the
# Envoy proxy for this Gateway is deployed into this namespace as
# `envoy-gateway` (Deployment + LoadBalancer Service).
#
# External access (same pattern as traefik):
#   - Data-plane customization — LoadBalancer pinned to 10.0.0.71 (MetalLB
#     `load-balancer` pool), deployment resources and priority class — is set
#     on the EnvoyProxy CR referenced through spec.infrastructure.parametersRef
#     (see envoy-gateway-envoyproxy.yaml), per the Envoy Gateway docs.
#   - HTTPS for mmontes-llm.duckdns.org (exact match). The Certificate and
#     secret are created automatically by cert-manager from the
#     cert-manager.io/cluster-issuer annotation, one per listener.
#   - Local DNS resolution of the hostname: a Pi-hole record (homelab repo)
#     for LAN clients and a CoreDNS `hosts` entry in infrastructure/dns for
#     in-cluster clients.
#   - The HTTP listener has no hostname so the ai tenant's HTTPRoutes
#     (Stage 4, LAB-369) keep their existing hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: envoy
  infrastructure:
    # Point the data plane at our EnvoyProxy for the LoadBalancer IP pin,
    # resources and priority class (envoy-gateway-envoyproxy.yaml).
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: mmontes-llm.duckdns.org
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          # Envoy Gateway requires the core group to be omitted on Secret refs.
          - name: envoy-gateway-tls
            kind: Secret
