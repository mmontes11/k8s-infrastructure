# EnvoyProxy customization for the envoy-gateway data plane (LAB-362).
#
# Referenced from the Gateway via spec.infrastructure.parametersRef — the
# Gateway API mechanism for per-Gateway controller config — per the Envoy
# Gateway docs on customizing the EnvoyProxy:
# https://gateway.envoyproxy.io/docs/tasks/operations/customize-envoyproxy/
#
# Values are modeled on the traefik gateways, adapted for Envoy Gateway:
#   - LoadBalancer pinned to 10.0.0.71 (the envoy-gateway address; traefik
#     uses 10.0.0.80) via the data-plane Service annotations.
#   - Memory sized up from traefik (requests 128Mi / limit 512Mi) for
#     inference routing + xDS translation; no CPU limit, as with traefik.
#   - priorityClassName system-node-critical (matches the traefik gateways).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway
spec:
  provider:
    kubernetes:
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
        pod:
          priorityClassName: system-node-critical
      envoyService:
        annotations:
          metallb.io/loadBalancerIPs: 10.0.0.71
