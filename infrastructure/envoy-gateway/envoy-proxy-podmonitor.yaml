# PodMonitor for the Envoy Gateway data-plane proxy (LAB-365).
#
# Under the GatewayNamespace deploy mode the proxy for the `ai-gateway`
# Gateway is a Deployment in this namespace whose pods carry
# app.kubernetes.io/name=envoy, app.kubernetes.io/component=proxy and
# gateway.networking.k8s.io/gateway-name=ai-gateway. A PodMonitor (not
# a ServiceMonitor) is required because the proxy Service only exposes the
# listener ports (80/443); Envoy's admin Prometheus endpoint
# (envoy_cluster_* / envoy_http_* — the gateway-side request, retry,
# upstream and TLS stats) listens on container port `metrics` (19001) at
# /stats/prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
spec:
  namespaceSelector:
    matchNames:
      - networking
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      gateway.networking.k8s.io/gateway-name: ai-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 25s
      honorLabels: false
