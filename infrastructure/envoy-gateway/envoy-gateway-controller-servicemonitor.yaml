# ServiceMonitor for the Envoy Gateway controller (LAB-365).
#
# The gateway-helm chart (v1.9.3) exposes the controller's Prometheus
# metrics (envoy_gateway_*) on the `envoy-gateway` Service port `metrics`
# (19001) at /metrics. Selected by the controller's own label
# control-plane=envoy-gateway (the data-plane proxy Service shares the
# name `envoy-gateway` in this namespace under the GatewayNamespace deploy
# mode but carries the app.kubernetes.io/name=envoy labels instead).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway-controller
spec:
  namespaceSelector:
    matchNames:
      - networking
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 25s
      honorLabels: false
