# Envoy Gateway CRDs (gateway.envoyproxy.io), rendered from the official
# `gateway-crds-helm` chart v1.9.2.
#
# These are vendored (not a kustomization URL like the `gateway-api`
# Kustomization) because no non-vendored install path exists for this chart:
#   - Kustomization URL: the envoyproxy/gateway repo (v1.9.2, full tree
#     checked) ships no static CRD YAML — every CRD file is a Helm template
#     (gated on .Values.crds.envoyGateway.enabled), and the repo's static
#     `envoy-gateway-crds.yaml` release asset is unreachable by kustomize's
#     git-based GitHub fetcher (release assets are not in the git tree).
#   - HelmRelease: the full rendered manifest (2.58 MiB) exceeds Helm's
#     1 MiB release-Secret limit — reproduced: `Secret
#     "sh.helm.release.v1.envoy-ai-gateway-crds.v1" is invalid: data: Too
#     long`. Splitting is not possible either: the largest single CRD
#     (envoyproxies, 1.43 MiB) alone exceeds the limit, and the chart has no
#     per-CRD enable values.
#
# The Gateway API CRDs the same chart also ships are owned by the
# `gateway-api` Kustomization (gateway-api v1.5.1 experimental) and are NOT
# included here. Flux server-side apply handles the large CRD sizes that
# client-side apply would reject. Re-render when the chart version changes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: networking
resources:
  - envoy-gateway-crds-backendtrafficpolicies.yaml
  - envoy-gateway-crds-backends.yaml
  - envoy-gateway-crds-clienttrafficpolicies.yaml
  - envoy-gateway-crds-envoyextensionpolicies.yaml
  - envoy-gateway-crds-envoypatchpolicies.yaml
  - envoy-gateway-crds-envoyproxies.yaml
  - envoy-gateway-crds-httproutefilters.yaml
  - envoy-gateway-crds-securitypolicies.yaml
