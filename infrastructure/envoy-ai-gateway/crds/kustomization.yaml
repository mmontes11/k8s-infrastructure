# Envoy Gateway CRDs (gateway.envoyproxy.io), installed from the static
# `envoy-gateway-crds.yaml` asset of the matching Envoy Gateway GitHub
# release — the "installing CRDs separately" path documented upstream
# (https://gateway.envoyproxy.io/latest/install/install-helm/#installing-crds-separately).
#
# A HelmRelease of the gateway-crds-helm chart is not an option: the rendered
# release exceeds Helm's 1 MiB release-Secret limit (envoyproxy/gateway#6105,
# reproduced). The release asset is not fetchable by the local kustomize CLI
# (v5.4.3) but IS by Flux source-controller — same pattern as the
# cert-manager CRDs Kustomization in this repo.
#
# The version is pinned in the asset URL and upgraded by Renovate (see
# .github/renovate.json, github-releases datasource), grouped with the
# gateway-helm chart tag so the CRDs and the controller bump together.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/envoyproxy/gateway/releases/download/v1.9.3/envoy-gateway-crds.yaml
