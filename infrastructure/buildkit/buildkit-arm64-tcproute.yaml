apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: buildkit-arm64
  labels:
    app: buildkit-arm64
spec:
  parentRefs:
    - name: traefik-internal
      namespace: networking
      sectionName: builder-arm64
    # Dual-parent: envoy-internal takes the same section while traefik keeps
    # serving (LAB-386, no cutover yet).
    - name: envoy-internal
      namespace: envoy-internal
      sectionName: builder-arm64
  rules:
     - backendRefs:
        - name: buildkit-arm64
          port: 1234